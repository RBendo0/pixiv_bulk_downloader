[tool.poetry]
name = "pixiv_bulk_downloader"
version = "3.0.0"

# Derived from the original "pixiv-bulk-downloader"
# by Haruna (eggplants), distributed under the MIT License.
description = "Command-line application for downloading and managing Pixiv bookmarks."

authors = [
    "RBendo0"
]

license = "MIT"

readme = "README.md"

repository = "https://github.com/RBendo0/pixiv_bulk_downloader"

keywords = [
    "pixiv",
    "bookmark",
    "downloader",
    "cli",
]

classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
pixivpy3 = "^3.7.5"
playwright = "^1.62.0"
requests = "^2.34.2"
pwinput = "^1.0.3"
wcwidth = "^0.8.2"

[tool.poetry.group.dev.dependencies]
pyinstaller = "^6.22.2"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = [
    "poetry-core",
]

[tool.poetry.scripts]
pbd-launch = "pixiv_bulk_downloader.main:main"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"